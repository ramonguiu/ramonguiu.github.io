<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/images/profile.jpg' | relative_url }}">
  <link rel="alternate" type="text/markdown" title="LLM-friendly summary" href="{{ '/llms.txt' | relative_url }}">
  {% if page.url == "/" %}{% include person-jsonld.html %}{% endif %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">~/ramonguiu</a>
    <nav>
      {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</span>
    <span>
      <a href="{{ site.links.linkedin }}">linkedin</a> ·
      <a href="{{ site.links.github }}">github</a> ·
      <a href="{{ site.links.x }}">x</a> ·
      <a href="{{ '/feed.xml' | relative_url }}">rss</a>
    </span>
  </footer>
</body>
</html>
